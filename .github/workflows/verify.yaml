name: Verify development firmware
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_request_age.py
      - run: pip install esphome==2026.10.2
      - run: esphome compile tests/device.yaml
